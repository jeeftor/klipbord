name: CI and Container Image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

env:
  IMAGE_NAME: ghcr.io/jeeftor/klipbord

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './.git/*'))"

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover ./...

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.inspect.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
            echo "tags=type=raw,value=${TAG}" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
            echo "tags=type=sha,prefix=dev-" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ steps.version.outputs.tags }}
          flavor: |
            latest=${{ steps.version.outputs.latest }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect pushed image digest
        id: inspect
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

  build-kb:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            extension: ''
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            extension: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            extension: ''
            archive: tar.gz
          - goos: linux
            goarch: amd64
            extension: ''
            archive: tar.gz
          - goos: windows
            goarch: amd64
            extension: .exe
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build server and CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/kb-server${{ matrix.extension }}" .
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/kb-cli${{ matrix.extension }}" ./cmd/kb
          if [ "${{ matrix.archive }}" = tar.gz ]; then
            tar -C dist -czf "dist/kb-server_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" kb-server
            tar -C dist -czf "dist/kb-cli_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" kb-cli
          else
            zip -j "dist/kb-server_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "dist/kb-server${{ matrix.extension }}"
            zip -j "dist/kb-cli_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "dist/kb-cli${{ matrix.extension }}"
          fi

      - name: Upload server and CLI archives
        uses: actions/upload-artifact@v4
        with:
          name: kb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kb_*
          if-no-files-found: error

  release-kb:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-kb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.publish.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kb archives
        uses: actions/download-artifact@v4
        with:
          pattern: kb-*
          path: dist
          merge-multiple: true

      - name: Publish kb release assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/install.sh
          sha256sum dist/kb-*.tar.gz dist/kb-*.zip > dist/kb_checksums.txt
          echo "hashes=$(sha256sum dist/kb-*.tar.gz dist/kb-*.zip | base64 -w0)" >> $GITHUB_OUTPUT
          gh release create "${GITHUB_REF_NAME}" --generate-notes --target master || true
          gh release upload "${GITHUB_REF_NAME}" dist/kb-*.tar.gz dist/kb-*.zip dist/kb_checksums.txt dist/install.sh --clobber

  # Guard job for provenance-kb: GitHub Actions can't put an if: condition
  # directly on a reusable workflow (uses:) job — it fails at startup with
  # "workflow file issue". This guard evaluates the condition and only passes
  # the hashes output on tag pushes. The reusable workflow always runs but
  # receives empty hashes on non-tag pushes (which SLSA handles as a no-op).
  provenance-kb-guard:
    if: always() && github.event_name == 'push'
    needs: release-kb
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.check.outputs.hashes }}
    steps:
      - id: check
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RAW_HASHES: ${{ needs.release-kb.outputs.hashes }}
        run: |
          if [ "$IS_TAG" = "true" ] && [ -n "$RAW_HASHES" ]; then
            echo "hashes=$RAW_HASHES" >> $GITHUB_OUTPUT
          else
            echo "hashes=" >> $GITHUB_OUTPUT
          fi

  provenance-kb:
    needs: provenance-kb-guard
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.provenance-kb-guard.outputs.hashes }}"
      upload-assets: true

  sign-kb:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-kb
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kb archives
        uses: actions/download-artifact@v4
        with:
          pattern: kb-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign kb archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/kb-*.tar.gz dist/kb-*.zip; do
            cosign sign-blob --yes --output-signature="${f}.sig" --output-certificate="${f}.pem" "$f"
          done
          gh release upload "${GITHUB_REF_NAME}" dist/kb-*.sig dist/kb-*.pem --clobber

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/jeeftor/klipbord
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  sign:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image
        run: |
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}

  sbom-attest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      attestations: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.2

      - name: Generate SBOM
        run: trivy image --format spdx-json --output sbom.spdx.json ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  notify-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram release notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            🚀 <b>Klipbord ${{ github.ref_name }}</b>

            <a href="https://github.com/jeeftor/klipbord/releases/tag/${{ github.ref_name }}">Release notes</a> · <a href="https://github.com/jeeftor/klipbord/pkgs/container/klipbord">Docker image</a>

  notify-failure:
    if: github.event_name == 'push' && failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram failure notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ❌ <b>CI failed</b> on <code>${{ github.ref_name }}</code>

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a>
