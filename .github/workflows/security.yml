name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Run go mod download
        run: go mod download

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.2

      - name: Trivy filesystem scan (Go dependencies)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-fs.sarif .
        continue-on-error: true

      - name: Trivy Dockerfile config scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-dockerfile.sarif Dockerfile
        continue-on-error: true

      - name: Build Docker image for scanning
        run: docker build -t klipbord:scan .

      - name: Trivy image scan
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-image.sarif klipbord:scan
        continue-on-error: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Upload Dockerfile SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dockerfile.sarif
          category: trivy-dockerfile

      - name: Upload image SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          go-version-input: '1.26'
          go-package: ./...
          repo-checkout: false
        continue-on-error: true
