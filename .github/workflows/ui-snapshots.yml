name: UI snapshots

on:
  pull_request:
    paths:
      - '.github/scripts/capture-ui-snapshots.sh'
      - '.github/playwright-cli.json'
      - '.github/workflows/ui-snapshots.yml'
      - 'Dockerfile'
      - '**.go'
      - 'internal/webassets/static/**'
      - 'internal/app/testdata/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chrome Headless Shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/klipbord-playwright-browsers
        run: npx --yes --package=@playwright/cli@0.1.17 playwright-cli install-browser chromium --only-shell

      - name: Install media fixture tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Build and start Klipbord container
        run: |
          mkdir -p .tmp/data
          sudo chown 10001:10001 .tmp/data
          docker build --tag klipbord:ui-snapshots .
          docker run --detach --name klipbord-ui-snapshots \
            --publish 8080:8080 \
            --volume "$PWD/.tmp/data:/data" \
            --env BASE_URL=http://127.0.0.1:8080 \
            --env VISION_ENABLED=false \
            klipbord:ui-snapshots

      - name: Capture screenshots
        env:
          BASE_URL: http://127.0.0.1:8080
          OUTPUT_DIR: artifacts/ui-snapshots
          PLAYWRIGHT_CLI_VERSION: 0.1.17
          PLAYWRIGHT_CLI_CONFIG: ${{ github.workspace }}/.github/playwright-cli.json
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/klipbord-playwright-browsers
          PWTEST_DAEMON_SESSION_DIR: ${{ runner.temp }}/klipbord-playwright-daemon
        run: .github/scripts/capture-ui-snapshots.sh

      - name: Collect container log
        if: always()
        run: docker logs klipbord-ui-snapshots >.tmp/klipbord-container.log 2>&1 || true

      - name: Stop container
        if: always()
        run: docker rm --force klipbord-ui-snapshots || true

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: |
            artifacts/ui-snapshots/
            .tmp/klipbord-container.log
          if-no-files-found: warn
