name: SBOM

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sbom:
    name: Generate and publish SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Run go mod download
        run: go mod download

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.2
      - name: Generate SBOM
        run: trivy fs --format spdx-json --output sbom.spdx.json .

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 30

      - name: Attach SBOM to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --target master || true
          gh release upload "${GITHUB_REF_NAME}" sbom.spdx.json --clobber
